# =========================================================================
#  Site-wide content and configuration.
#  Prose lives in content/{en,fr}/ as Markdown; this file holds the
#  structured data (contact details, fees, affiliations, labels, SEO).
#  Edit, then run:  python build.py
# =========================================================================

site:
  url: "https://lucietherapy.com"
  default_lang: en
  langs: [en, fr]
  # Bumped automatically from file mtimes; only used as a fallback.
  founding_year: 2023

person:
  name: "Lucie RAMET"
  # Used in structured data / bylines; the display name above keeps the caps.
  display_name: "Lucie Ramet"
  job_title:
    en: "Chartered Psychologist, CBT & ACT Therapist"
    fr: "Psychologue Clinicienne, Thérapeute TCC et ACT"
  role_html:
    en: "Chartered Psychologist<br>CBT &amp; ACT Therapist"
    fr: "Psychologue Clinicienne<br>Thérapeute TCC et ACT"
  email: "info@lucietherapy.com"
  image: "media/profile.jpg"
  languages: ["en", "fr"]
  social:
    - "https://www.instagram.com/lucie_ramet_psychologist/"
    - "https://www.linkedin.com/in/lucie-ramet-psychologue/"
  instagram: "https://www.instagram.com/lucie_ramet_psychologist/"
  linkedin: "https://www.linkedin.com/in/lucie-ramet-psychologue/"

# ------------------------------------------------------------------ practice
practice:
  title:
    en: "Where to find me"
    fr: "Où me trouver"
  in_person_title:
    en: "In person in Hove & Brighton"
    fr: "En personne à Hove et Brighton"
  in_person_desc:
    # NOTE: the old EN and FR copy disagreed on the days (EN said Mon/Wed/Fri,
    # FR said Mon/Fri). Both now say Mon/Wed/Fri -- correct this if wrong.
    en: "I see clients in person on Mondays, Wednesdays and Fridays at:"
    fr: "Je reçois les patients en personne les lundis, mercredis et vendredis à :"
  location_name: "Brighton and Hove Psychotherapy"
  address:
    street: "49 Church Road"
    locality: "Hove"
    postcode: "BN3 2BE"
    region: "East Sussex"
    country_code: "GB"
    country:
      en: "United Kingdom"
      fr: "Royaume-Uni"
  # Verify against Google Maps before relying on the map pin.
  geo:
    lat: 50.829399
    lng: -0.176462
  opening_hours:
    - days: ["Monday", "Wednesday", "Friday"]
      opens: "09:00"
      closes: "18:00"
  # Search-query form: always resolves, unlike an embed tied to a place ID
  map_url: "https://www.google.com/maps/search/?api=1&query=49+Church+Road+Hove+BN3+2BE+UK"
  contact_web: "www.brightonandhovepsychotherapy.com"
  contact_web_url: "https://www.brightonandhovepsychotherapy.com/practitioners/lucie-ramet/"

  online_title:
    en: "Online therapy in French and English"
    fr: "Thérapie en ligne, en français et en anglais"
  online_desc:
    en: "I offer online sessions in French and English for adults and adolescents across the UK, Europe and Asia — including French speakers living abroad who would rather work in their first language."
    fr: "Je propose des séances en ligne en français et en anglais pour adultes et adolescents au Royaume-Uni, en Europe et en Asie — notamment pour les francophones expatriés qui préfèrent être accompagnés dans leur langue maternelle."
  online_sub:
    en: "Sessions by secure video link, scheduled around your time zone."
    fr: "Séances par visioconférence sécurisée, planifiées selon votre fuseau horaire."

  # Separate, secondary collaboration -- kept distinct from the main
  # online offer so it stops overshadowing it.
  singapore_title:
    en: "Special collaboration — Asia / Singapore"
    fr: "Collaboration spéciale — Asie / Singapour"
  singapore_desc:
    en: "Having previously practised in Singapore with The Other Clinic, I continue this collaboration with telehealth sessions for clients based in Singapore or who have since relocated to Europe."
    fr: "Ayant exercé à Singapour avec The Other Clinic, je poursuis cette collaboration en proposant des téléconsultations pour les patients basés à Singapour ou installés depuis en Europe."
  singapore_sub:
    en: "For clients in Singapore: telehealth sessions from 4pm to 9pm SGT."
    fr: "Pour les patients à Singapour : séances de 16h à 21h SGT."
  sg_contact: "hello@theotherclinic.sg"
  sg_web_url: "https://theotherclinic.sg/lucie-ramet/"
  sg_web_label:
    en: "The Other Clinic"
    fr: "The Other Clinic"

# ---------------------------------------------------------------------- fees
fees:
  title:
    en: "Fees & Appointments"
    fr: "Tarifs & Rendez-vous"
  therapy:
    title:
      en: "Individual therapy session"
      fr: "Séance individuelle de thérapie"
    price:
      en: "50 min — £90"
      fr: "50 min — 100 €"
    amount_gbp: 90
    amount_eur: 100
  supervision:
    title:
      en: "Clinical supervision"
      fr: "Séance de supervision"
    price:
      en: "50 min — £90*"
      fr: "50 min — 100 €*"
