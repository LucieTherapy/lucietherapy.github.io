<!-- THERAPY INQUIRY MODAL -->
<div id="contact-modal" class="modal-overlay">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="modal-close" class="modal-close" aria-label="{{ c.form.btn_close }}">&times;</button>
        <h2 id="modal-title">{{ c.form.title }}</h2>
        <form action="https://formsubmit.co/{{ c.person.email }}" method="POST" class="contact-form">
            <input type="hidden" name="_subject" value="New Therapy Inquiry" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="page" value="{{ canonical }}" />
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

            <div class="form-group">
                <label for="email">{{ c.form.lbl_email }}</label>
                <input type="email" id="email" name="email" autocomplete="email" required />
            </div>

            <div class="form-group">
                <label for="availability">{{ c.form.lbl_availability }}</label>
                <input
                    type="text"
                    id="availability"
                    name="availability"
                    placeholder="{{ 'ex. mercredi matin' if lang == 'fr' else 'e.g. Wednesday mornings' }}"
                />
            </div>

            <div class="form-group">
                <span class="form-label">{{ c.form.lbl_type }}</span>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="type" value="Online" checked />
                        <span>{{ c.form.opt_online }}</span>
                    </label>
                    <label>
                        <input type="radio" name="type" value="In-Person" />
                        <span>{{ c.form.opt_inperson }}</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">{{ c.form.lbl_message }}</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>

            <button type="submit" class="submit-btn">{{ c.form.btn_submit }}</button>
        </form>
    </div>
</div>

<!-- SUPERVISION INQUIRY MODAL -->
<div id="supervision-modal" class="modal-overlay">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="supervision-modal-title">
        <button id="supervision-modal-close" class="modal-close" aria-label="{{ c.form_supervision.btn_close }}">
            &times;
        </button>
        <h2 id="supervision-modal-title">{{ c.form_supervision.title }}</h2>
        <form action="https://formsubmit.co/{{ c.person.email }}" method="POST" class="contact-form">
            <input type="hidden" name="_subject" value="New Supervision Inquiry" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="page" value="{{ canonical }}" />
            <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

            <div class="form-group">
                <label for="sup-email">{{ c.form_supervision.lbl_email }}</label>
                <input type="email" id="sup-email" name="email" autocomplete="email" required />
            </div>

            <div class="form-group">
                <span class="form-label">{{ c.form_supervision.lbl_background }}</span>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="background" value="Trainee" checked />
                        <span>{{ c.form_supervision.opt_trainee }}</span>
                    </label>
                    <label>
                        <input type="radio" name="background" value="Qualified Therapist" />
                        <span>{{ c.form_supervision.opt_qualified }}</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="sup-availability">{{ c.form_supervision.lbl_availability }}</label>
                <input
                    type="text"
                    id="sup-availability"
                    name="availability"
                    placeholder="{{ 'ex. mercredi matin' if lang == 'fr' else 'e.g. Wednesday mornings' }}"
                />
            </div>

            <div class="form-group">
                <label for="sup-message">{{ c.form_supervision.lbl_message }}</label>
                <textarea id="sup-message" name="message" rows="4"></textarea>
            </div>

            <button type="submit" class="submit-btn">{{ c.form_supervision.btn_submit }}</button>
        </form>
    </div>
</div>
