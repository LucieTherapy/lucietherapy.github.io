{% extends "base.html" %}

{% block content %}
<section class="section-pad top-section">
    <div class="container-wide">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="{{ home_url }}">{{ c.person.name }}</a>
            <span aria-hidden="true">/</span>
            <span>{{ s.nav_blog }}</span>
        </nav>

        <header class="content-header">
            <h1>{{ doc.title }}</h1>
            <hr class="divider" />
        </header>

        <div class="post-grid">
            {% for post in posts %}
            <article class="blog-post-card">
                <a href="{{ post.url }}" class="blog-card-link">
                    {% if post.image %}
                    <img
                        src="{{ img_src(post.image) }}"
                        alt=""
                        class="blog-thumb"
                        loading="lazy"
                        {{ img_attrs(post.image) }}
                    />
                    {% endif %}
                    <div class="blog-content">
                        <h2 class="blog-title">{{ post.title }}</h2>
                        <p class="blog-excerpt">{{ post.excerpt }}</p>
                        <span class="blog-link">{{ s.read_more }} →</span>
                    </div>
                </a>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
