{% extends "base.html" %}

{% block content %}
<article class="section-pad top-section">
    <div class="container-narrow">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="{{ home_url }}">{{ c.person.name }}</a>
            <span aria-hidden="true">/</span>
            <a href="{{ blog_url }}">{{ s.nav_blog }}</a>
            <span aria-hidden="true">/</span>
            <span>{{ doc.title }}</span>
        </nav>

        <header class="content-header">
            <h1>{{ doc.title }}</h1>
            {% if doc.date %}
            <p class="post-meta">
                <time datetime="{{ doc.date }}">{{ s.published }} {{ pretty_date(doc.date, lang) }}</time>
            </p>
            {% endif %}
            <hr class="divider" />
        </header>

        {% if doc.image %}
        <figure class="page-hero">
            <img
                src="{{ img_src(doc.image) }}"
                alt="{{ doc.title }}"
                {{ img_attrs(doc.image) }}
            />
        </figure>
        {% endif %}

        <div class="prose">{{ doc.body | safe }}</div>
    </div>
</article>
{% endblock %}
